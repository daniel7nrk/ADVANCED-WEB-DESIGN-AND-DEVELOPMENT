<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question 4 - KVMM School Management Dashboard</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f2f4f7; padding: 30px 15px; }
    h1 { text-align: center; color: #222; margin-bottom: 30px; }

    /* 6-column grid: each card spans 2 columns -> 3 per row */
    .dashboard {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 20px;
        max-width: 800px;
        margin: 0 auto;
    }
    .card {
        grid-column: span 2;
        background: white;
        border: 1px solid #ccc;
        border-radius: 12px;
        padding: 25px 10px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        cursor: pointer;
    }
    /* Second row: center the 2 remaining cards */
    .card:nth-child(4) { grid-column: 2 / span 2; }
    .card:nth-child(5) { grid-column: 4 / span 2; }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        border-color: #1a8ca8;
    }
    .card .icon { font-size: 52px; margin-bottom: 10px; }
    .card h3 { font-size: 18px; color: #222; font-weight: normal; }

    /* Tablet: 2 per row */
    @media (max-width: 768px) {
        .dashboard { grid-template-columns: repeat(2, 1fr); }
        .card, .card:nth-child(4), .card:nth-child(5) { grid-column: auto; }
    }
    /* Phone: 1 per row */
    @media (max-width: 480px) {
        .dashboard { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<h1>KVMM School Management Dashboard</h1>

<div class="dashboard">
    <div class="card"><div class="icon">&#128101;</div><h3>Students</h3></div>
    <div class="card"><div class="icon">&#128218;</div><h3>Modules</h3></div>
    <div class="card"><div class="icon">&#127891;</div><h3>Marks</h3></div>
    <div class="card"><div class="icon">&#128226;</div><h3>Announcements</h3></div>
    <div class="card"><div class="icon">&#9881;&#65039;</div><h3>Settings</h3></div>
</div>

</body>
</html>
