<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question 6 - JavaScript</title>
<style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 30px; background: #f4f5f7; }
    .card { background: white; max-width: 420px; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    h2 { margin-bottom: 15px; }
    button { padding: 10px 18px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 25px; }
</style>
</head>
<body>

<h2>Part A: Movie Ticket Booking</h2>
<button onclick="getTicketPrice()">Buy Ticket</button>

<h2>Part B: Teacher Information</h2>
<div class="card" id="output"></div>

<script>
    // ---------- PART A ----------
    function getTicketPrice() {
        var age = parseInt(prompt("Enter your age:"));
        var price;

        if (isNaN(age) || age < 0) {
            alert("Invalid age. Please enter a valid number.");
            return;
        }

        if (age <= 12) {            // below 12 (age 12 is included here so nobody is left out)
            price = 1000;
        } else if (age <= 18) {     // 13 - 18
            price = 1500;
        } else if (age <= 59) {     // 19 - 59
            price = 2000;
        } else {                    // 60 and above
            price = 1200;
        }

        alert("Your ticket price is " + price + " RWF");
    }

    // ---------- PART B ----------
    var teacher = {
        name: "Mr. Jean Claude Habimana",
        subject: "Mathematics",
        phone: "0788123456",
        email: "jc.habimana@school.rw"
    };

    // Print neatly on the screen
    document.getElementById("output").innerHTML =
        "<p><b>Name:</b> " + teacher.name + "</p>" +
        "<p><b>Subject:</b> " + teacher.subject + "</p>" +
        "<p><b>Phone:</b> " + teacher.phone + "</p>" +
        "<p><b>Email:</b> " + teacher.email + "</p>";

    // Also print in the console
    console.log("Teacher Information");
    console.log("Name: " + teacher.name);
    console.log("Subject: " + teacher.subject);
    console.log("Phone: " + teacher.phone);
    console.log("Email: " + teacher.email);
</script>
</body>
</html>
