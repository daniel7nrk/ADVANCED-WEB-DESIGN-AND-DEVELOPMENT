<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h3>what is your name </h3> <input type="text" name="" id=""><button onclick="display_name()">click me</button>
<p></p>
</body>
    <script>
    function display_name() {
        let name = document.querySelectorAll("input")[0].value;
        let data = document.querySelector("p");
        data.innerText = `your name is ${name}`;
    }
    </script>
</html>
