<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        *{
            margin: 0;
            padding: 0%;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right,rgb(223, 220, 220), rgb(203, 114, 114),rgb(187, 7, 7));
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        div{
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
        }

        input[type="text"],input[type="password"],input[type="submit"]{
            width: 100%;
            padding: 10px 30px;
            border-radius: 8px;
            outline:none;
            border: 1px solid #0b0808;
                         
        }
        input{
            margin-top: 10px;
            margin-bottom: 10px;
        }

        #submit{
            background-color: rgb(187, 7, 7);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        h3,h5{
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <h3>welcome user!</h3>
        <h5>login to Our website</h5>
        <form action="">
            <label for="username">username</label><br>
            <input type="text" name="username" id="username"><br>

            <label for="password">password</label><br>
            <input type="password" name="password" id="password"><br>
            
            <input type="submit" value="submit" id="submit">
            <h5>Don't have an accout <a href="">sign up</a></h5>
        </form>
    </div>
    
</body>
</html>
