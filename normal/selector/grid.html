<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            font-family: sans-serif;
            min-height: 100vh;
            background: linear-gradient( to bottom ,rgb(254, 254, 254),rgb(181, 241, 241), rgb(0, 255, 255) ) ;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        @media(max-width: 480px){
            #gridcontainer{
                display: grid;
                grid-template-columns: repeat(1,300px);
                gap: 10px;
            }


        }
        @media(min-width: 481px) and (max-width: 768px){
            #gridcontainer{
                display: grid;
                grid-template-columns: repeat(2,300px);
                gap: 10px;
            }
        }
        @media(min-width: 769px){
            #gridcontainer{
                display: grid;
                grid-template-columns: repeat(3,300px);
                gap: 10px;
            }
        }
        
        #box{
            background-color:rgb(212, 223, 213);
            padding: 60px;
            border-radius: 15px;
            text-align: center;
            gap:10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .txt{
            
            text-align: none;
            background-color: #d6e894;
            columns: white;
            padding: 10px 15px;
            border-radius: 10px;
        }
        a{
            text-decoration: none;
            color: #0000ff;
            
        }
        img{
            width: 100%;
            height: 100px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="gridcontainer">
        <div id="box">
            <img src="img/images1.jpg" alt="Image 1">
            <a href="" class="txt">Read More</a>
        </div>
        <div id="box">
            <img src="img/images2.jpg" alt="Image 2">
            <a href="" class="txt">Read More</a>
        </div>
        <div id="box">
            <img src="img/images3.jpg" alt="Image 3">
            <a href="" class="txt">Read More</a>
        </div>
        <div id="box">
            <img src="img/images4.jpg" alt="Image 4">
            <a href="" class="txt">Read More</a>
        </div>
        <div id="box">
            <img src="img/images5.jpg" alt="Image 5">
            <a href="" class="txt">Read More</a>
        </div>
        <div id="box">
            <img src="img/images6.jpg" alt="Image 6">
            <a href="" class="txt">Read More</a>
        </div>
    </div>
        
</body>
</html>
